/* ---------------------------------------------------------------- utils */
const rgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
}
function noise1(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash2(i, 0, s) * (1 - u) + hash2(i + 1, 0, s) * u; }
function fbm(x, s = 0) { return noise1(x, s) * 0.6 + noise1(x * 2.1, s + 7) * 0.28 + noise1(x * 4.7, s + 13) * 0.12; }
function shadeP(c, f) {

  if (f >= 1) { r += (255 - r) * (f - 1); g += (240 - g) * (f - 1); b += (200 - b) * (f - 1); }

}

const rnd = (a, b) => a + Math.random() * (b - a);

  ' ':'00000','.':'00002',':':'02020','-':'00700','+':'02720','/':'11244','!':'22202','?':'61202','%':'51245',"'":'22000',',':'00024','<':'12421','>':'42124','(':'12221',')':'42224','=':'07070','*':'05250','#':'57575','_':'00007','&':'25357' };

}
const tw = (s, sc = 1) => String(s).length * 4 * sc - sc;
function txtC(s, cx, y, col, sc = 1, sh) { txt(s, Math.round(cx - tw(s, sc) / 2), y, col, sc, sh); }

/* ---------------------------------------------------- props: egg, nest, exit */
const EGG = [false, true].map(cr => maskCanvas(14, 18, (x, y) => {
  const yc = 10.5, dy = (y + 0.5 - yc) / ((y + 0.5) < yc ? 10.5 : 7.2); if (Math.abs(dy) >= 1) return null;
  const half = 6.4 * Math.sqrt(1 - dy * dy), dx = x + 0.5 - 7; if (Math.abs(dx) > half) return null;

const PORTAL = ['#fff1a8', '#ffc24a', '#ff7a3a', '#e0453f', '#9a2a55', '#5a1c48', '#9a2a55', '#e0453f', '#ff7a3a', '#ffc24a'];

function drawParts(cam) {

function bevel(x, y, w, h, base, hi, lo) { ctx.fillStyle = C.ink2; ctx.fillRect(x, y, w, h); ctx.fillStyle = lo; ctx.fillRect(x + 1, y + 1, w - 2, h - 2); ctx.fillStyle = hi; ctx.fillRect(x + 1, y + 1, w - 3, h - 3); ctx.fillStyle = base; ctx.fillRect(x + 2, y + 2, w - 4, h - 4); }

function smallBtn(x, y, w, label, active, fn, col) {

/* ------------------------------------------------------------ main loop */
function uiTick() {

function frameStep() {

let last = performance.now(), acc = 0;
function loop(now) {

load('demo');

window.DINO = {

  count(t) { return G.T.count(t); },
